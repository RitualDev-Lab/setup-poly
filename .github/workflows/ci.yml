name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Setup Poly Action (Local Checkout)
        uses: ./
        with:
          version: '0.1.0'
          cache: 'false'

      - name: Verify Poly CLI Execution
        shell: bash
        run: |
          poly --version
          poly --help
          poly which npm
